<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4a0c10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pyrus">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Alletiders Nisse</title>
<link rel="icon" type="image/png" href="game/icon24.png">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
  #screen { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: default; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  * { -webkit-touch-callout: none; }
  input { -webkit-touch-callout: default; }
  #overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; padding: 16px; box-sizing: border-box; text-align: center;
    background: radial-gradient(ellipse at 50% 35%, #8a1a20 0%, #4a0c10 55%, #1a0406 100%);
    color: #fff1cf; font: 700 18px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #overlay h1 { margin: 0; font: 400 clamp(42px, 8vw, 92px)/1 Georgia, serif; color: #ffd76a; text-shadow: 0 4px 0 #3a0608; }
  #overlay p { margin: 0; max-width: 520px; opacity: .85; }
  #overlay label { display: flex; flex-direction: column; gap: 6px; font-size: 15px; opacity: .9; }
  #name { -webkit-user-select: text; user-select: text; cursor: text; font: 700 20px system-ui, sans-serif; padding: 10px 14px; border-radius: 12px; border: 2px solid #ffd76a; background: #fff8e8; color: #3a1a08; width: min(280px, 80vw); text-align: center; }
  #go { font: 800 24px system-ui, sans-serif; color: #fff; background: #c8102e; border: 0; border-radius: 40px; padding: 16px 44px; box-shadow: 0 6px 0 #6a0610; cursor: pointer; }
  #overlay.busy #go, #overlay.busy label { display: none; }
  #players { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: min(640px, 92vw); }
  #players:empty { display: none; }
  #players .lbl { width: 100%; font-size: 14px; opacity: .8; }
  .pl { display: flex; align-items: center; gap: 2px; border-radius: 20px; background: rgba(0,0,0,.25); border: 2px solid rgba(255,215,106,.45); }
  .pl.on { background: rgba(255,215,106,.25); border-color: #ffd76a; }
  .pl button { cursor: pointer; background: none; border: 0; color: #fff1cf; font: 800 15px system-ui, sans-serif; padding: 7px 4px 7px 14px; }
  .pl small { font-weight: 700; opacity: .7; margin-left: 6px; }
  .pl .x { padding: 7px 12px 7px 6px; opacity: .55; font-size: 14px; }
  .pl .x:hover { opacity: 1; }
  #langs { position: absolute; top: 14px; right: 14px; display: flex; gap: 6px; }
  #langs button { cursor: pointer; font: 800 15px system-ui, sans-serif; color: #fff1cf; background: rgba(0,0,0,.25); border: 2px solid rgba(255,215,106,.5); border-radius: 20px; padding: 7px 14px; }
  #langs button.on { background: #ffd76a; color: #3a0608; border-color: #ffd76a; }
  #status { min-height: 1.4em; font-size: 16px; color: #ffd76a; }
  #small { position: fixed; bottom: 10px; left: 0; right: 0; font-size: 12px; opacity: .55; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="overlay">
  <div id="langs"><button data-lang="da">Dansk</button><button data-lang="en">English</button></div>
  <h1>Alletiders Nisse</h1>
  <p data-t="intro">Pyrus' julekalender – med sommerferie og halloween. Spil med mus og tastatur – eller på telefon og tablet.</p>
  <label><span data-t="name">Dit navn (til highscorelisterne)</span>
    <input id="name" maxlength="24" placeholder="Spiller" autocomplete="off">
  </label>
  <div id="players"></div>
  <button id="go" data-t="go">Klik for at starte</button>
  <div id="status"></div>
  <div id="small" data-t="small">Første gang hentes spillets billeder og lyde undervejs, så det kan tage et øjeblik.</div>
</div>
<script type="module" src="runtime/app.js?v=mvu8mivi"></script>
</body>
</html>
