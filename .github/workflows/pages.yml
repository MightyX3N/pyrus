# Builds and publishes the website every time something is pushed to main:
# the translation layer (tools/) is built, the lists of the gamemode's files are made,
# and everything is put on GitHub Pages.
name: Website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the translation layer
        working-directory: tools
        run: npm ci && npm run build
      - name: List the gamemode's files
        run: pip install pillow && python tools/make_lists.py
      - name: Leave the tools out of the website
        run: rm -rf tools/node_modules
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
