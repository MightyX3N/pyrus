# Uploads a new version of the gamemode to its Steam Workshop item when a release is published on
# GitHub; the release notes become the change note. It can also be run by hand from the Actions tab.
#
# The first time (no ID in tools/workshop/workshop_id.txt) it uses the newest of your Workshop items
# called "Alletiders Nisse", or makes a new hidden one, and saves its ID in the repository.
# Every upload then also sets the addon type and tags, the title and the description from
# tools/workshop/ (workshop.json and description.bbcode) – SteamCMD can't, so that part logs in like
# the Steam client does. The picture and visibility are left as they are on Steam.
#
# Needs these secrets (Settings → Secrets and variables → Actions):
#   STEAM_USERNAME        the Steam account that owns the Workshop item
#   STEAM_VDF             that account's SteamCMD login (config.vdf, base64)
#   STEAM_REFRESH_TOKEN   that account's Steam client login token (make it with tools/workshop/login.mjs)
name: Workshop
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mode:
        description: 'upload: send a new version to the Workshop · build: only make the .gma to download'
        type: choice
        options: [upload, build]
        default: upload
      changelog:
        description: 'Change note (for upload)'
        required: false
        default: 'Update'
concurrency:
  group: workshop
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Workshop addon from game/
        run: python3 tools/workshop/make_addon.py
      - name: Pack it into a .gma
        run: |
          curl -sSL -o fastgmad.zip https://github.com/WilliamVenner/fastgmad/releases/latest/download/fastgmad_linux.zip
          unzip -q fastgmad.zip -d fastgmad && chmod +x fastgmad/fastgmad
          mkdir -p out
          fastgmad/fastgmad create -warninvalid -folder build/addon -out out/alletidersnisse.gma > /dev/null
          cp tools/workshop/icon.jpg out/icon.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: alletidersnisse-workshop
          path: out/
          compression-level: 0
  upload:
    if: github.event_name == 'release' || inputs.mode == 'upload'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Get the Steam client tools
        working-directory: tools/workshop
        run: npm install --no-audit --no-fund
      - name: The Workshop item
        id: item
        env:
          STEAM_REFRESH_TOKEN: ${{ secrets.STEAM_REFRESH_TOKEN }}
        run: |
          id=$(tr -dc '0-9' < tools/workshop/workshop_id.txt)
          if [ -z "$id" ]; then
            id=$(node tools/workshop/update.mjs find | tr -dc '0-9')
            if [ -n "$id" ]; then echo "Using the existing item $id"; else echo "No item yet – making a new hidden one"; fi
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: The change note (Steam only keeps plain ASCII change notes)
        id: note
        env:
          NOTE: ${{ github.event.release.body || inputs.changelog || 'Update' }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, unicodedata
          t = os.environ.get('NOTE') or 'Update'
          tag = os.environ.get('TAG')
          if tag: t = tag + '\n\n' + t
          for a, b in {'æ': 'ae', 'ø': 'oe', 'å': 'aa', 'Æ': 'Ae', 'Ø': 'Oe', 'Å': 'Aa', '–': '-', '—': '-', '’': "'", '“': '"', '”': '"'}.items():
              t = t.replace(a, b)
          t = unicodedata.normalize('NFKD', t).encode('ascii', 'ignore').decode()
          print('text<<END_OF_NOTE'); print(t.strip()); print('END_OF_NOTE')
          PY
      - name: Build the Workshop addon from game/
        run: python3 tools/workshop/make_addon.py
      - name: Upload it (SteamCMD)
        uses: gmod-workshop/workshop-upload@abf7dd8f90a29039627e1278508531957fe5b708 # v1.1.0 (the v1 tag is older and lacks visibility and markdown-changelog)
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          vdf: ${{ secrets.STEAM_VDF }}
          id: ${{ steps.item.outputs.id }}
          folder: build/addon
          # only used when a new item is made:
          title: ${{ steps.item.outputs.id == '' && 'Alletiders Nisse' || '' }}
          icon: ${{ steps.item.outputs.id == '' && format('{0}/tools/workshop/icon.jpg', github.workspace) || '' }}
          visibility: ${{ steps.item.outputs.id == '' && '2' || '' }}
          markdown-changelog: ${{ steps.note.outputs.text }}
      - name: Set the addon type, tags, title and description
        env:
          STEAM_REFRESH_TOKEN: ${{ secrets.STEAM_REFRESH_TOKEN }}
          ID: ${{ steps.item.outputs.id }}
        run: |
          id="$ID"
          if [ -z "$id" ]; then id=$(node tools/workshop/update.mjs find | tr -dc '0-9'); fi
          if [ -z "$id" ]; then echo "::error::Could not find the new Workshop item"; exit 1; fi
          node tools/workshop/update.mjs "$id"
          echo "$id" > tools/workshop/workshop_id.txt
      - name: Save the item's ID in the repository
        run: |
          if ! git diff --quiet -- tools/workshop/workshop_id.txt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/workshop/workshop_id.txt
            git commit -m "Workshop item ID [skip ci]"
            git pull --rebase origin main && git push origin HEAD:main
          fi
